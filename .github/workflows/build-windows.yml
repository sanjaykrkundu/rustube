name: Build Rustube (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Tauri app
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~\.cargo\bin\cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri installer
        run: cargo tauri build --bundles nsis

      - name: Package editable portable app
        shell: pwsh
        run: |
          Copy-Item web/minimal.js target/release/minimal.js -Force
          Compress-Archive -Path target/release/rustube.exe,target/release/minimal.js -DestinationPath target/release/rustube-portable.zip -Force

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: rustube-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload editable portable app
        uses: actions/upload-artifact@v4
        with:
          name: rustube-windows-portable
          path: target/release/rustube-portable.zip
          if-no-files-found: error

[package]
name = "rustube"
version = "0.1.0"
description = "A small native YouTube Music desktop player"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true

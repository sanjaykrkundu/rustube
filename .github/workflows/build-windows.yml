name: Build Windows apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tauri
            directory: .
            kind: tauri
          - name: egui
            directory: versions/egui
            kind: rust
          - name: iced
            directory: versions/iced
            kind: rust

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        if: matrix.kind == 'tauri'
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri installer
        if: matrix.kind == 'tauri'
        working-directory: ${{ matrix.directory }}
        run: cargo tauri build --bundles nsis

      - name: Build native app
        if: matrix.kind == 'rust'
        working-directory: ${{ matrix.directory }}
        run: cargo build --release

      - name: Upload Tauri installer
        if: matrix.kind == 'tauri'
        uses: actions/upload-artifact@v4
        with:
          name: rustube-tauri-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload egui executable
        if: matrix.name == 'egui'
        uses: actions/upload-artifact@v4
        with:
          name: rustube-egui-windows
          path: versions/egui/target/release/rustube-egui.exe
          if-no-files-found: error

      - name: Upload Iced executable
        if: matrix.name == 'iced'
        uses: actions/upload-artifact@v4
        with:
          name: rustube-iced-windows
          path: versions/iced/target/release/rustube-iced.exe
          if-no-files-found: error
